# The checks on the checks: break the pipeline on purpose and confirm something
# notices. `checks.yml` asserts the claims; this asserts the claims are worth
# asserting.
#
# Kept off the push path for two reasons. It is slow — `parity.py --falsify` is
# a browser launch per mutation, ~19 minutes locally — and it answers a question
# that does not change commit to commit: a claim goes hollow when someone edits
# the checking logic, not when the pipeline changes. Weekly plus a manual button
# is the cadence that matches what it measures.
#
# Both jobs gate against a KNOWN_BLIND list and fail in either direction: a new
# blind spot fails, and so does a listed gap that has since been closed and not
# deleted from the list.

name: mutations

on:
  schedule:
    # Mondays 05:00 UTC. Note that GitHub disables scheduled workflows after 60
    # days with no repository activity, and does not run them on forks — if this
    # stops appearing, that is the first thing to check, and `workflow_dispatch`
    # below still works.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutations
  cancel-in-progress: false

jobs:
  # 20s locally: 27 defects, each one a full report.py run in a temporary copy
  # of the tree. Nothing is written inside the repository.
  falsify:
    name: falsify.py (27 defects vs report.py)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python3 fixtures/falsify.py

  # ~19 minutes locally: 33 defects applied to an in-memory copy of the page,
  # each one its own page load. The runner is slower than the dev machine, hence
  # the generous timeout — it is a ceiling on a hang, not an estimate.
  parity-falsify:
    name: parity.py --falsify (33 defects vs the browser)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python3 -m playwright install --with-deps chromium
      # stdbuf keeps the line-by-line progress flowing. Python block-buffers a
      # redirected stdout, and Actions captures one, so without this a 19 minute
      # run shows nothing until it ends and is indistinguishable from a hang.
      - run: stdbuf -oL python3 fixtures/parity.py --falsify
