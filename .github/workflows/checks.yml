# The regression net, run on every push and pull request.
#
# Both jobs here gate: `report.py` exits 1 when a claim breaks or a number
# drifts from `baseline.json`, and `parity.py` exits 1 when the browser and the
# script disagree, 2 when it could not check at all. Nothing in this file is
# allowed to be a job that cannot fail — the slower mutation batteries, which
# check that these two are worth running, live in `mutations.yml`.
#
# `report.py` needs nothing but `requirements.txt`, deliberately, so it stays
# the cheap check that always runs. `parity.py` needs Playwright, a Chromium
# build, and network egress to docs.opencv.org, because it drives the real page
# with the real opencv.js.
#
# Actions are pinned to commit SHAs rather than `@v7`, with the version in a
# trailing comment. A major tag is mutable: whoever controls it can repoint it
# at different code without this file changing, and that code then runs on every
# push and every fork pull request. `dependabot.yml` keeps the pins from going
# stale, which is the failure the pin trades for and is worth naming — an
# unattended pin stops receiving the action's own security fixes.

name: checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only, and no secret is referenced anywhere below. Both jobs run
# repository code against committed fixtures and need nothing else.
permissions:
  contents: read

# Superseded runs on the same ref are pointless; keep the newest.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0.45s locally. Claims plus baseline drift, no external dependency.
  report:
    name: report.py (claims + baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Pinned to the version this repository is developed and verified on,
          # so a red build means the code and not the interpreter. Widening this
          # to a matrix is a separate decision with its own failures to triage.
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python3 fixtures/report.py

  # 6.7s of checking locally, behind a ~1 minute Chromium install.
  parity:
    name: parity.py (browser vs script)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Not cached on purpose. The browser is ~1 minute to install and the cache
      # would have to be keyed on the resolved Playwright version to stay
      # correct; a stale hit gives a browser and a client that disagree, which
      # presents as a parity failure in this repository's own pixels. The minute
      # is worth more as certainty than as speed.
      - run: python3 -m playwright install --with-deps chromium
      # Exits 2 rather than 0 when it could not check — a missing browser or an
      # unreachable CDN fails the job instead of passing quietly.
      - run: python3 fixtures/parity.py
