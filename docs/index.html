<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<title>Coloring Page Maker</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --line: #e5e7eb;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    text-align: center;
    padding: 48px 16px 24px;
  }
  header h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  header p { margin: 8px 0 0; color: var(--muted); font-size: 1rem; }
  main { max-width: 960px; margin: 0 auto; padding: 0 20px 40px; }

  .drop {
    display: block;
    border: 2px dashed #cbd5e1;
    border-radius: var(--radius);
    background: var(--card);
    padding: 44px 20px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .drop:hover { border-color: var(--accent); background: #f8faff; }
  .drop.over { background: #eff4ff; border-color: var(--accent); }
  .drop .primary { font-size: 1.05rem; font-weight: 550; }
  .drop strong { color: var(--accent); font-weight: 650; }
  .drop .hint { color: var(--muted); font-size: 0.875rem; margin-top: 8px; }
  .drop input { display: none; }

  .or {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin: 16px 0 10px;
  }
  .url-row {
    display: flex;
    gap: 10px;
    max-width: 560px;
    margin: 0 auto;
  }
  .url-row input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 0.9rem;
    color: var(--ink);
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  .url-row input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  @media (max-width: 480px) { .url-row { flex-direction: column; } }

  select {
    font: inherit;
    font-size: 0.9rem;
    color: var(--ink);
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  .val {
    font-variant-numeric: tabular-nums;
    font-weight: 650;
    color: var(--accent);
    background: #eff4ff;
    border-radius: 6px;
    padding: 1px 7px;
    font-size: 0.8rem;
    min-width: 2.4em;
    text-align: center;
  }
  /* The numeric readouts are type-in fields: styled as the badge until you
     reach for them, so the row stays calm but the value is obviously editable. */
  input.val {
    font-family: inherit;
    border: 1px solid transparent;
    width: 4.2em;
    cursor: text;
  }
  input.val:hover { border-color: #c7d7fb; background: #fff; }
  input.val:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    background: #fff;
  }
  .card-detail .unit {
    font-weight: 650;
    color: var(--accent);
    margin-left: -4px;
  }
  input[type="range"] { accent-color: var(--accent); width: 180px; }
  input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

  .status {
    text-align: center;
    min-height: 1.4em;
    color: var(--muted);
    font-size: 0.9rem;
    margin: 8px 0 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    text-align: center;
  }
  .card canvas {
    width: 100%;
    height: auto;
    border-radius: 8px;
    background: #fff;
    border: 1px solid var(--line);
    cursor: zoom-in;
  }
  .card canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Actual-size viewer */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(15, 23, 42, 0.88);
    overflow: auto;
    padding: 56px 24px 210px;   /* bottom room so the panel never hides the page */
  }
  .lightbox[hidden] { display: none; }
  .lightbox-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: rgba(15, 23, 42, 0.6);
    color: #fff;
  }
  .lightbox-caption { font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .lightbox-close {
    background: none;
    border: none;
    color: #fff;
    font-size: 1.8rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 6px;
  }
  .lightbox-stage { display: flex; min-height: 100%; }
  .lightbox-stage img {
    margin: auto;            /* center when smaller than the viewport */
    background: #fff;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
  }
  /* Per-image controls, floating over the viewer so you can tweak full screen. */
  .lightbox-panel {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    z-index: 60;
    width: max-content;
    max-width: min(720px, calc(100vw - 32px));
    max-height: 42vh;
    overflow-y: auto;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 12px 44px rgba(0, 0, 0, 0.55);
    padding: 6px 18px 12px;
  }
  .lightbox-panel:empty { display: none; }
  .card .name {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 10px 0;
    word-break: break-all;
  }
  .card-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 12px;
    margin: 10px 0 2px;
  }
  .card-controls select { padding: 5px 8px; font-size: 0.8rem; }
  .card-check {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
  }
  .card-detail {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;          /* word-valued badges (Line width) can be wide */
    gap: 4px 8px;
    margin: 2px 0;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
  }
  .card-detail input[type="range"] { width: 110px; }
  .card-mini {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
  }
  .card-mini select { padding: 4px 6px; font-size: 0.78rem; }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font: inherit;
    font-size: 0.875rem;
    font-weight: 550;
    cursor: pointer;
    transition: background 0.15s;
  }
  .card .btn { margin: 0 3px; }
  .btn:hover { background: var(--accent-hover); }
  .btn.secondary {
    background: #fff;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn.secondary:hover { background: #eff4ff; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.secondary:disabled:hover { background: #fff; }
  .actions { display: flex; justify-content: center; gap: 12px; margin: 8px 0 24px; }
  footer {
    text-align: center;
    padding: 32px 16px;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<header>
  <h1>Coloring Page Maker</h1>
  <p>Turn any picture into a printable outline for kids to color.</p>
</header>

<main>
  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" multiple />
    <div class="primary"><strong>Click to upload</strong> or drag images here</div>
    <div class="hint">PNG, JPG, or WEBP &middot; multiple files supported</div>
  </label>

  <div class="or">or paste a link to a picture</div>
  <div class="url-row">
    <input type="url" id="urlInput" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="https://example.com/photo.jpg" aria-label="Image URL" />
    <button class="btn" id="urlAdd">Add</button>
  </div>

  <div class="status" id="status">Loading the image engine…</div>
  <div class="actions">
    <button class="btn" id="printAll" disabled>Print all</button>
    <button class="btn secondary" id="downloadAll" disabled>Download all</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>Runs entirely in your browser. Your images never leave your device.</footer>

<!-- Actual-size viewer: click any page to inspect it at full resolution. -->
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Page at actual size">
  <div class="lightbox-bar">
    <span class="lightbox-caption" id="lightboxCaption"></span>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close viewer">&times;</button>
  </div>
  <div class="lightbox-stage" id="lightboxStage"></div>
  <div class="lightbox-panel" id="lightboxPanel"></div>
</div>

<script>
// ---- OpenCV.js readiness ------------------------------------------------
let cvReady = false;
const statusEl = document.getElementById('status');
function onOpenCvReady() {
  cv['onRuntimeInitialized'] = () => {
    cvReady = true;
    statusEl.textContent = 'Ready! Drop in some pictures.';
  };
}

// ---- State --------------------------------------------------------------
const results = []; // { name, canvas }
const grid = document.getElementById('grid');

// ---- Controls -----------------------------------------------------------
const el = (id) => document.getElementById(id);

// Every setting is per-image — each card carries its own. There are no global
// controls; defaults below seed a freshly uploaded picture.
const DEFAULT_DETAIL = 5, DEFAULT_THUMB_SCALE = 25;
let pendingNote = '';   // one-shot status suffix (e.g. "skipped 2 files")
const originals = [];
// { name, img, style, despeckle, detail, ink, lineWidth, thumb, thumbScale }

// Seed a freshly added picture (from a file or a URL) with the default per-image
// settings and queue it. Default to Bold (threshold): robust across photos and
// cartoons alike. The per-card dropdown switches to Cartoon/Thin when wanted.
function addOriginal(name, img) {
  originals.push({
    name, img, style: 'threshold',
    despeckle: false, detail: DEFAULT_DETAIL, ink: DEFAULT_INK, lineWidth: 0,
    thumb: true, thumbScale: DEFAULT_THUMB_SCALE, thumbAbove: false,
  });
}

// ---- File intake --------------------------------------------------------
const drop = el('drop'), fileInput = el('file');
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
['dragenter', 'dragover'].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); })
);
['dragleave', 'drop'].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); })
);
drop.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));

async function handleFiles(fileList) {
  if (!cvReady) { statusEl.textContent = 'Still loading the engine — try again in a moment.'; return; }
  const all = [...fileList];
  const imageFiles = all.filter((f) => f.type.startsWith('image/'));
  let skipped = all.length - imageFiles.length;   // non-image files dropped
  if (!imageFiles.length) {
    statusEl.textContent = all.length
      ? "Those aren't images I can read — try PNG, JPG, or WEBP."
      : '';
    return;
  }
  statusEl.textContent = 'Reading images…';
  let added = 0;
  for (const f of imageFiles) {
    // Isolate each file: a corrupt or unsupported image must not abort the batch.
    let img;
    try { img = await loadImage(f); }
    catch { skipped++; continue; }
    if (!img.naturalWidth || !img.naturalHeight) { skipped++; continue; }
    addOriginal(stem(f.name), img);
    added++;
  }
  if (!added) {
    statusEl.textContent = "Couldn't read those images — they may be corrupt or an unsupported format.";
    return;
  }
  pendingNote = skipped ? `skipped ${skipped} file${skipped > 1 ? 's' : ''} (couldn't read)` : '';
  rerunAll();
}

function stem(filename) {
  return filename.replace(/\.[^.]+$/, '');
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };       // decoded; URL no longer needed
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
    img.src = url;
  });
}

// ---- Add from a URL -----------------------------------------------------
// Paste a direct image link and pull it in like an upload. crossOrigin is
// required: OpenCV reads the pixels and we later call toDataURL/toBlob, both of
// which throw on a canvas tainted by a cross-origin image. With crossOrigin set,
// a host that doesn't send CORS headers fails to load (onerror) instead of
// tainting the canvas — we surface that as a clear message.
const urlInput = el('urlInput'), urlAdd = el('urlAdd');
urlAdd.addEventListener('click', () => addFromUrl(urlInput.value.trim()));
urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); addFromUrl(urlInput.value.trim()); }
});

function loadImageFromUrl(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('load failed'));
    img.src = url;
  });
}

// Derive a filename stem from the URL path (used for the card label + download).
function nameFromUrl(url) {
  if (/^data:/i.test(url)) return 'image';
  try {
    const last = new URL(url, location.href).pathname.split('/').filter(Boolean).pop();
    return (last && stem(decodeURIComponent(last))) || 'image';
  } catch { return 'image'; }
}

async function addFromUrl(url) {
  if (!cvReady) { statusEl.textContent = 'Still loading the engine — try again in a moment.'; return; }
  if (!url) return;
  if (!/^(https?:\/\/|data:image\/)/i.test(url)) {
    statusEl.textContent = 'Enter a direct image link starting with https://.';
    return;
  }
  statusEl.textContent = 'Fetching image…';
  let img;
  try { img = await loadImageFromUrl(url); }
  catch {
    statusEl.textContent = "Couldn't load that image — the site may block cross-origin use, or it isn't a direct image link.";
    return;
  }
  if (!img.naturalWidth || !img.naturalHeight) {
    statusEl.textContent = "That URL didn't return an image I can read.";
    return;
  }
  addOriginal(nameFromUrl(url), img);
  urlInput.value = '';
  pendingNote = '';
  rerunAll();
}

// ---- Core conversion (mirrors coloringify.py) ---------------------------
const DESPECKLE_MIN_AREA = 12;

// Cartoon (lineart) ink coverage: what percentage of the picture to keep as
// ink. The brightness cutoff behind it is measured from each image rather than
// fixed, because "dark enough to be an outline" varies hugely between pictures
// — on the four cartoon images this was tuned against, the same 4% target
// resolved to cutoffs anywhere from 21 to 229. A fixed cutoff is what made this
// style unusable on half of them. (Those images are not in the repo; `in/` is
// gitignored so nobody commits copyrighted source pictures.)
// The top of the range is well past useful for ordinary cartoon art — most
// pictures are a solid black rectangle long before 100% — but it is the script's
// range too, and where the ceiling actually falls depends on the picture. A
// drawing that fills the frame with no white background needs far more than one
// cut out on white. Better to let the slider go where the CLI goes than to cap
// it at a number derived from a handful of images.
const DEFAULT_INK = 4, INK_MIN = 1, INK_MAX = 100;

// Line width: how heavy the finished stroke is, independent of the style.
// 0 leaves the outline exactly as the style drew it (the old behaviour);
// negative shaves layers off every stroke, positive grows them.
const LINE_WIDTH_LABELS =
  ['Thinnest', 'Thinner', 'Thin', 'Normal', 'Thick', 'Thicker', 'Thickest'];
// Derived, not hard-coded: the slider range and the labels must stay the same
// length or the badge renders `undefined`, so only one of them is a free choice.
const LINE_WIDTH_MIN = -3;
const LINE_WIDTH_MAX = LINE_WIDTH_MIN + LINE_WIDTH_LABELS.length - 1;

// Brightness cutoff that inks roughly `pct`% of the picture: the smallest V at
// which at least that share of pixels is darker. A 256-bin histogram makes this
// exact for 8-bit data in one pass, with no sort. Returns 1..255 — never 0, or
// a picture with a pure-black region would come back completely blank.
// Mirrors ink_cutoff() in coloringify.py; the two must agree bin for bin.
function inkCutoff(v, pct) {
  const d = v.data, n = d.length;
  const hist = new Uint32Array(256);
  for (let i = 0; i < n; i++) hist[d[i]]++;
  const want = n * pct / 100;
  let below = 0;                              // pixels strictly darker than t
  for (let t = 1; t < 256; t++) {
    below += hist[t - 1];
    if (below >= want) return t;
  }
  return 255;
}

// Remove black blobs smaller than minArea. `bin` is single-channel 8-bit,
// 0=ink, 255=paper. Returns a new Mat the caller must delete. Mirrors
// despeckle() in coloringify.py via connectedComponentsWithStats.
function despeckleMat(bin, minArea) {
  const inkMask = new cv.Mat();
  cv.bitwise_not(bin, inkMask);                 // 255 where ink, 0 where paper
  const labels = new cv.Mat(), stats = new cv.Mat(), centroids = new cv.Mat();
  const n = cv.connectedComponentsWithStats(inkMask, labels, stats, centroids, 8, cv.CV_32S);
  const keep = new Uint8Array(n);               // keep[0] = 0 (background stays paper)
  for (let i = 1; i < n; i++) {
    keep[i] = stats.intAt(i, cv.CC_STAT_AREA) >= minArea ? 1 : 0;
  }
  const out = new cv.Mat(bin.rows, bin.cols, cv.CV_8UC1);
  const lab = labels.data32S, res = out.data;
  for (let p = 0; p < lab.length; p++) res[p] = keep[lab[p]] ? 0 : 255;
  inkMask.delete(); labels.delete(); stats.delete(); centroids.delete();
  return out;
}

// Peel `rounds` layers off every stroke (Zhang-Suen thinning). Each round
// removes the outermost ink pixel from each side of a stroke *unless* removing
// it would disconnect the stroke — so unlike cv.dilate this thins the lines
// without punching gaps in them or shortening them. `bin` is single-channel
// 8-bit, 0=ink, 255=paper. Returns a new Mat the caller deletes.
//
// One documented exception, inherent to the algorithm: an isolated 2x2 block of
// ink is erased outright (all four pixels satisfy the delete test at once). No
// other shape vanishes — a lone pixel, a 1x2 pair and every larger blob all keep
// at least one pixel. At print resolution a 2x2 blob is a speck, so losing it is
// no worse than "Remove specks", but it is a real deletion, not a thinning.
//
// The ink buffer carries a 1px border of paper so edge pixels get thinned like
// any other, matching the np.pad() that coloringify.py relies on. Without it the
// two implementations disagree on every stroke touching the edge of the page.
function thinMat(bin, rounds) {
  const w = bin.cols, h = bin.rows, src = bin.data;
  const pw = w + 2;                             // padded stride
  const ink = new Uint8Array(pw * (h + 2));     // zero-filled = paper border
  for (let y = 0; y < h; y++) {
    const s = y * w, d = (y + 1) * pw + 1;
    for (let x = 0; x < w; x++) ink[d + x] = src[s + x] ? 0 : 1;
  }
  const doomed = [];
  for (let r = 0; r < rounds; r++) {
    let changed = false;
    // Two sub-passes per round, each clearing a different pair of corners;
    // alternating them keeps the stroke centred instead of eating it from
    // one side.
    for (let step = 0; step < 2; step++) {
      doomed.length = 0;
      for (let y = 1; y <= h; y++) {
        for (let x = 1; x <= w; x++) {
          const p = y * pw + x;
          if (!ink[p]) continue;
          // Neighbours clockwise from north, in Zhang-Suen's P2..P9 order.
          const n2 = ink[p - pw],     n3 = ink[p - pw + 1], n4 = ink[p + 1],
                n5 = ink[p + pw + 1], n6 = ink[p + pw],     n7 = ink[p + pw - 1],
                n8 = ink[p - 1],      n9 = ink[p - pw - 1];
          const b = n2 + n3 + n4 + n5 + n6 + n7 + n8 + n9;
          if (b < 2 || b > 6) continue;   // endpoint (keep) or interior (keep)
          let a = 0;                      // 0->1 transitions around the ring
          if (!n2 && n3) a++;
          if (!n3 && n4) a++;
          if (!n4 && n5) a++;
          if (!n5 && n6) a++;
          if (!n6 && n7) a++;
          if (!n7 && n8) a++;
          if (!n8 && n9) a++;
          if (!n9 && n2) a++;
          if (a !== 1) continue;          // >1 means deleting would disconnect
          const ok = step === 0
            ? n2 * n4 * n6 === 0 && n4 * n6 * n8 === 0
            : n2 * n4 * n8 === 0 && n2 * n6 * n8 === 0;
          if (ok) doomed.push(p);
        }
      }
      // Delete as a batch: the test above assumes a stable neighbourhood.
      if (doomed.length) {
        changed = true;
        for (const p of doomed) ink[p] = 0;
      }
    }
    if (!changed) break;                  // already down to 1px everywhere
  }
  const out = new cv.Mat(h, w, cv.CV_8UC1);
  const dst = out.data;
  for (let y = 0; y < h; y++) {
    const s = (y + 1) * pw + 1, d = y * w;
    for (let x = 0; x < w; x++) dst[d + x] = ink[s + x] ? 0 : 255;
  }
  return out;
}

// Grow every stroke by `rounds` pixels. Ink is 0 and paper is 255, so eroding
// (a local minimum) is what spreads the ink. Returns a new Mat to delete.
function fattenMat(bin, rounds) {
  const k = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(3, 3));
  const out = new cv.Mat();
  cv.erode(bin, out, k, new cv.Point(-1, -1), rounds,
           cv.BORDER_CONSTANT, cv.morphologyDefaultBorderValue());
  k.delete();
  return out;
}

// Redraw the outline at the requested weight. Returns a new Mat in every case
// (including width 0) so the caller can always delete the input.
function setLineWidth(bin, width) {
  const w = Math.max(LINE_WIDTH_MIN, Math.min(LINE_WIDTH_MAX, width));
  if (w < 0) return thinMat(bin, -w);
  if (w > 0) return fattenMat(bin, w);
  return bin.clone();
}

function makeColoringPage(o) {
  const { img, style, despeckle, detail } = o;
  // Flatten any transparency onto white by drawing over a white canvas.
  const src = document.createElement('canvas');
  src.width = img.naturalWidth;
  src.height = img.naturalHeight;
  const sctx = src.getContext('2d');
  sctx.fillStyle = '#ffffff';
  sctx.fillRect(0, 0, src.width, src.height);
  sctx.drawImage(img, 0, 0);

  const mat = cv.imread(src);                 // RGBA
  const gray = new cv.Mat();
  cv.cvtColor(mat, gray, cv.COLOR_RGBA2GRAY);
  let out = new cv.Mat();

  if (style === 'edges') {
    const blur = new cv.Mat();
    cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
    cv.Canny(blur, out, 50, 150);
    cv.bitwise_not(out, out);                 // black lines on white
    blur.delete();
  } else if (style === 'lineart') {
    // Keep the darkest `ink`% of the picture and whiten the rest.
    //
    // Deliberately *not* filtered on saturation. The old rule also required
    // S < 60, on the theory that ink is grey and fills are colourful — but
    // cartoon outlines are very often dark *and* saturated (navy, dark teal,
    // brown), and that test threw them away, taking most of the drawing with
    // them. Brightness alone, with a per-image cutoff, handles both.
    //
    // V (the HSV value: max of R/G/B) rather than luma, so a saturated colour
    // is judged by how light it is, not by how bright it looks to the eye.
    const rgb = new cv.Mat();
    cv.cvtColor(mat, rgb, cv.COLOR_RGBA2RGB);
    const hsv = new cv.Mat();
    cv.cvtColor(rgb, hsv, cv.COLOR_RGB2HSV);
    const channels = new cv.MatVector();
    cv.split(hsv, channels);
    const v = channels.get(2);
    // THRESH_BINARY writes 255 where src > thresh, so thresh = cutoff - 1
    // makes paper the pixels with V >= cutoff and ink those with V < cutoff.
    cv.threshold(v, out, inkCutoff(v, o.ink) - 1, 255, cv.THRESH_BINARY);
    rgb.delete(); hsv.delete(); v.delete(); channels.delete();
  } else {
    const blur = new cv.Mat();
    cv.medianBlur(gray, blur, 5);
    const C = detail;                         // higher = fewer lines
    cv.adaptiveThreshold(blur, out, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY, 9, C);
    blur.delete();
  }

  // Optional speck removal on the single-channel outline, before the color
  // guide (which paints onto a BGR promotion of this Mat). This runs before
  // the line-width pass so the minimum-area test sees the specks at the size
  // the style actually drew them.
  if (despeckle) {
    const cleaned = despeckleMat(out, DESPECKLE_MIN_AREA);
    out.delete();
    out = cleaned;
  }

  // Restroke at the chosen weight — applies to every style.
  if (o.lineWidth) {
    const reweighted = setLineWidth(out, o.lineWidth);
    out.delete();
    out = reweighted;
  }

  // Render the outline to an output canvas.
  const outCanvas = document.createElement('canvas');
  cv.imshow(outCanvas, out);

  // Color-reference thumbnail: either overlaid in the top-right corner, or in
  // its own white band above the outline so it never covers the drawing.
  if (o.thumb) {
    const W = outCanvas.width, H = outCanvas.height;
    const scale = o.thumbScale / 100;
    const stroke = Math.max(2, Math.round(W * 0.003));
    if (o.thumbAbove) {
      const pad = Math.round(W * 0.015) + 6;
      let tw = Math.max(1, Math.round(W * scale));
      let th = Math.max(1, Math.round(tw * src.height / src.width));
      const band = th + 2 * pad;
      const final = document.createElement('canvas');
      final.width = W;
      final.height = H + band;
      const fctx = final.getContext('2d');
      fctx.fillStyle = '#ffffff';
      fctx.fillRect(0, 0, final.width, final.height);
      const x = Math.round((W - tw) / 2), y = pad;
      fctx.drawImage(src, x, y, tw, th);
      fctx.strokeStyle = '#000';
      fctx.lineWidth = stroke;
      fctx.strokeRect(x, y, tw, th);
      fctx.drawImage(outCanvas, 0, band);
      mat.delete(); gray.delete(); out.delete();
      return final;
    }
    const ctx = outCanvas.getContext('2d');
    const margin = Math.round(W * 0.015) + 6;
    let tw = Math.max(1, Math.round(W * scale));
    let th = Math.max(1, Math.round(tw * src.height / src.width));
    if (th > H - 2 * margin) { th = H - 2 * margin; tw = Math.round(th * src.width / src.height); }
    const x = W - margin - tw, y = margin;
    ctx.drawImage(src, x, y, tw, th);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = stroke;
    ctx.strokeRect(x, y, tw, th);
  }

  mat.delete(); gray.delete(); out.delete();
  return outCanvas;
}

// ---- Render -------------------------------------------------------------
function rerunAll() {
  if (!cvReady || !originals.length) return;
  // Remember scroll position: rebuilding the grid must not yank the page to top.
  const scrollY = window.scrollY;
  statusEl.textContent = 'Drawing…';
  // Defer so the status paints before the (synchronous) heavy work.
  setTimeout(() => {
    // Build into a fragment and swap in one shot, so the old grid keeps its
    // height until the new cards are ready (no layout collapse, no scroll jump).
    const frag = document.createDocumentFragment();
    const next = [];
    originals.forEach((o, i) => {
      const canvas = makeColoringPage(o);
      next.push({ name: o.name, canvas });
      frag.appendChild(makeCard(i, canvas));
    });
    // `results` and the grid change together. Every card on screen carries
    // Print and Download buttons that look up results[i] when clicked, so a
    // window where one has been replaced and the other has not is a window
    // where a visible button acts on the wrong page — or on nothing at all.
    // Rendering above can take seconds; throughout it the old cards stay live
    // and keep working, because the entries they point at are still there.
    results.length = 0;
    results.push(...next);
    grid.replaceChildren(frag);
    const empty = results.length === 0;
    el('downloadAll').disabled = empty;
    el('printAll').disabled = empty;
    statusEl.textContent = `${results.length} page(s) ready. Every page has its own settings below — tweak any of them.`
      + (pendingNote ? ` · ${pendingNote}` : '');
    pendingNote = '';
    window.scrollTo(0, scrollY);
  }, 20);
}

// Friendly labels for the per-card style dropdown.
const STYLE_LABELS = { threshold: 'Bold', edges: 'Thin', lineart: 'Cartoon' };

// Re-render a single card in place when its style/despeckle changes — keeps the
// other cards (and the scroll position) untouched.
// Regenerate page `i`. The new page lands in `results[i]` immediately, whatever
// `deferSwap` says — Print and Download read from there, and they can fire in
// the same gesture that commits a value (typing in a number box, then clicking
// Print: the mousedown blurs the field, committing it, and the click runs before
// any deferred work). Only the card's DOM swap can be postponed, never the
// render, or that click prints the previous version of the picture.
function rerenderCard(i, deferSwap) {
  const o = originals[i];
  const canvas = makeColoringPage(o);
  results[i] = { name: o.name, canvas };

  const swap = () => {
    const scrollY = window.scrollY;
    const oldCard = grid.children[i];
    // If a control in this card had focus (e.g. a slider being nudged with the
    // arrow keys), remember it by aria-label so we can restore focus after the
    // rebuild — otherwise every keypress fires 'change', rebuilds the card, and
    // drops focus, making keyboard editing impossible.
    const active = document.activeElement;
    const focusKey = active && oldCard.contains(active) ? active.getAttribute('aria-label') : null;
    const newCard = makeCard(i, canvas);
    grid.replaceChild(newCard, oldCard);
    if (focusKey) {
      for (const c of newCard.querySelectorAll('[aria-label]')) {
        if (c.getAttribute('aria-label') === focusKey) { c.focus(); break; }
      }
    }
    window.scrollTo(0, scrollY);
  };

  // A commit triggered by focus leaving a type-in box has to wait a frame: the
  // change event fires while the browser is still mid-focus-transition, so
  // swapping the card now would tear out the element focus is moving to and
  // leave the user on <body>.
  if (deferSwap) requestAnimationFrame(swap); else swap();
}

// A checkbox + text label. onChange(checked) fires on toggle.
function mkCheck(text, checked, aria, onChange) {
  const label = document.createElement('label');
  label.className = 'card-check';
  const box = document.createElement('input');
  box.type = 'checkbox';
  box.checked = checked;
  box.setAttribute('aria-label', aria);
  box.addEventListener('change', () => onChange(box.checked));
  label.appendChild(box);
  label.appendChild(document.createTextNode(' ' + text));
  return label;
}

// A labelled range plus a value readout. onInput(value) updates state while
// dragging; onCommit() fires on release (use it to re-render).
//
// opts.labels — names the stops, and the readout becomes a read-only word
//   (Line width: seven named steps, where a typed number would mean nothing).
// opts.unit   — suffix for a numeric readout, which is an editable number box:
//   you can type an exact value instead of hunting for it with the mouse. That
//   matters most on the long ranges — Ink runs 1-100, where a pixel of drag is
//   a whole percent.
function mkSlider(text, min, max, value, aria, onInput, onCommit, opts = {}) {
  const labels = opts.labels, unit = opts.unit || '';
  // Spoken form of the unit. The visible "%" lives in a decorative span the
  // field does not own, so it has to be said explicitly or a screen-reader user
  // hears "42" for a value a sighted user reads as "42%".
  const unitWord = opts.unitWord || (unit === '%' ? 'percent' : unit);
  const fmt = (v) => (labels ? labels[v - min] : v + unit);
  // A <div>, not a <label>: the row holds two labelable controls now, and a
  // label wrapping both has no defined target. Each control carries its own
  // aria-label, whose text starts with the visible one (SC 2.5.3).
  const row = document.createElement('div');
  row.className = 'card-detail';
  const span = document.createElement('span');
  span.textContent = text;
  const range = document.createElement('input');
  range.type = 'range'; range.min = min; range.max = max; range.value = value;
  range.setAttribute('aria-label', aria);

  // A range input reports its raw number to assistive tech, which for Line
  // width is a bare -3..3 — a different scale from the word on screen, so a
  // screen-reader user could not tell "Normal" from "Thicker". aria-valuetext
  // overrides that with the same text shown.
  let val;
  if (labels) {
    val = document.createElement('output');
    // Visual duplicate of aria-valuetext; hide it so <output>'s implicit live
    // region does not announce every value a second time.
    val.setAttribute('aria-hidden', 'true');
  } else {
    val = document.createElement('input');
    val.type = 'number'; val.min = min; val.max = max; val.step = 1;
    val.setAttribute('aria-label',
      aria + ', exact value' + (unitWord ? ' in ' + unitWord : ''));
  }
  val.className = 'val';

  const say = (v) => {
    range.setAttribute('aria-valuetext', String(fmt(v)));
    if (labels) val.textContent = fmt(v); else val.value = v;
  };
  say(value);

  range.addEventListener('input', () => {
    const v = parseInt(range.value, 10);
    say(v);
    onInput(v);
  });
  range.addEventListener('change', onCommit);

  if (!labels) {
    // Commit on change (blur / Enter / spinner), not on input — re-rendering
    // per keystroke would fire on the "4" of "45". Out-of-range or empty input
    // snaps back rather than being pushed through to the pipeline.
    val.addEventListener('change', () => {
      const typed = parseInt(val.value, 10);
      const v = Number.isFinite(typed) ? Math.max(min, Math.min(max, typed))
                                       : parseInt(range.value, 10);
      range.value = v;
      say(v);
      onInput(v);
      // `true` = hold the DOM swap for one frame. This change event fires while
      // the browser is still moving focus, so replacing the card now would tear
      // out the element focus is heading for and strand the user on <body>. The
      // render itself is not deferred, so Print/Download in the same gesture
      // still get the new page. Enter is not special-cased: it fires change
      // natively and leaves focus in the field. (Calling blur() here, as this
      // once did, is what sent focus to <body>.)
      onCommit(true);
    });
  }

  row.append(span, range, val);
  if (!labels && unit) {
    const u = document.createElement('span');
    u.className = 'unit';
    // Safe to hide: the field's aria-label now spells the unit out (above).
    u.setAttribute('aria-hidden', 'true');
    u.textContent = unit;
    row.append(u);
  }
  return row;
}

// A labelled dropdown. options is [value, text] pairs. onChange(value) fires.
function mkSelect(text, options, value, aria, onChange) {
  const wrap = document.createElement('label');
  wrap.className = 'card-mini';
  const span = document.createElement('span');
  span.textContent = text;
  const sel = document.createElement('select');
  for (const [v, txt] of options) {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = txt;
    sel.appendChild(opt);
  }
  sel.value = value;
  sel.setAttribute('aria-label', aria);
  sel.addEventListener('change', () => onChange(sel.value));
  wrap.append(span, sel);
  return wrap;
}

// Build the per-image control rows for card i as a fragment. `commit` runs
// after any change that alters the rendered page, so the same controls work on
// both the grid card and the fullscreen viewer. Sliders update state live and
// only commit on release; checkboxes/selects commit immediately.
function buildControls(i, commit) {
  const o = originals[i];
  const frag = document.createDocumentFragment();

  // Row 1: style + speck removal (both change the outline).
  const row1 = document.createElement('div');
  row1.className = 'card-controls';
  row1.appendChild(mkSelect('', Object.entries(STYLE_LABELS), o.style,
    'Style for ' + o.name, (v) => { o.style = v; commit(); }));
  row1.appendChild(mkCheck('Remove specks', o.despeckle, 'Remove specks for ' + o.name,
    (c) => { o.despeckle = c; commit(); }));
  frag.appendChild(row1);

  // Detail only affects the Bold (threshold) path, so show it only there.
  if (o.style === 'threshold') {
    frag.appendChild(mkSlider('Detail', 1, 20, o.detail,
      'Detail (fewer to more lines) for ' + o.name,
      (v) => { o.detail = v; }, commit));
  }

  // Likewise Ink is the one knob Cartoon has: how much of the picture to keep.
  if (o.style === 'lineart') {
    frag.appendChild(mkSlider('Ink', INK_MIN, INK_MAX, o.ink,
      'Ink coverage (less to more of the picture kept) for ' + o.name,
      (v) => { o.ink = v; }, commit, { unit: '%' }));
  }

  // Line width reweights whatever the style drew, so it applies to all three.
  frag.appendChild(mkSlider('Line width', LINE_WIDTH_MIN, LINE_WIDTH_MAX, o.lineWidth,
    'Line width (thin to thick) for ' + o.name,
    (v) => { o.lineWidth = v; }, commit, { labels: LINE_WIDTH_LABELS }));

  // Row 2: color guide on/off, plus its size when on.
  const row2 = document.createElement('div');
  row2.className = 'card-controls';
  row2.appendChild(mkCheck('Color guide', o.thumb, 'Show color guide for ' + o.name,
    (c) => { o.thumb = c; commit(); }));
  if (o.thumb) {
    row2.appendChild(mkCheck('Above image', o.thumbAbove, 'Place color guide above the image for ' + o.name,
      (c) => { o.thumbAbove = c; commit(); }));
  }
  frag.appendChild(row2);
  if (o.thumb) {
    frag.appendChild(mkSlider('Guide size', 10, 40, o.thumbScale,
      'Color guide size for ' + o.name,
      (v) => { o.thumbScale = v; }, commit, { unit: '%' }));
  }

  return frag;
}

function makeCard(i, canvas) {
  const o = originals[i];
  const card = document.createElement('div');
  card.className = 'card';
  // The on-card canvas is scaled to fit; clicking opens it at actual size.
  canvas.setAttribute('role', 'button');
  canvas.setAttribute('tabindex', '0');
  canvas.setAttribute('aria-label', 'View ' + o.name + ' at actual size');
  canvas.title = 'Click to view actual size';
  canvas.addEventListener('click', () => openLightbox(i));
  canvas.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(i); }
  });
  card.appendChild(canvas);

  card.appendChild(buildControls(i, (defer) => rerenderCard(i, defer)));

  const label = document.createElement('div');
  label.className = 'name';
  label.textContent = o.name + '.png';
  card.appendChild(label);
  const pr = document.createElement('button');
  pr.className = 'btn';
  pr.textContent = 'Print';
  pr.setAttribute('aria-label', 'Print ' + o.name);
  // Read results[i] at click time, not the canvas this card was built with: a
  // re-render replaces it, and a click landing in the same gesture as a commit
  // would otherwise print the superseded copy.
  pr.onclick = () => printImages([results[i].canvas.toDataURL('image/png')]);
  card.appendChild(pr);
  const dl = document.createElement('button');
  dl.className = 'btn secondary';
  dl.textContent = 'Download';
  dl.onclick = () => downloadCanvas(results[i].canvas, o.name);
  card.appendChild(dl);
  return card;
}

function downloadCanvas(canvas, name) {
  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}

el('downloadAll').onclick = () => {
  results.forEach((r, i) => setTimeout(() => downloadCanvas(r.canvas, r.name), i * 250));
};

// ---- Actual-size viewer -------------------------------------------------
// Click a page to see it at 1:1 pixels (the on-card preview is scaled down, so
// this is where you check fine line detail). The same per-image controls are
// available here, so tweaks can be made while viewing full screen. Dismiss via
// the backdrop, the close button, or Escape.
const lightbox = el('lightbox'), lightboxStage = el('lightboxStage'),
  lightboxCaption = el('lightboxCaption'), lightboxPanel = el('lightboxPanel');
let lightboxReturnFocus = null;
let lightboxIndex = null;

function setLightboxImage() {
  const o = originals[lightboxIndex], canvas = results[lightboxIndex].canvas;
  let img = lightboxStage.querySelector('img');
  if (!img) { img = new Image(); lightboxStage.replaceChildren(img); }
  img.src = canvas.toDataURL('image/png');
  img.alt = o.name + ' at actual size';
  lightboxCaption.textContent = `${o.name}.png · ${canvas.width} × ${canvas.height} px`;
}

function openLightbox(i) {
  lightboxIndex = i;
  setLightboxImage();
  lightboxPanel.replaceChildren(buildControls(i, commitFromLightbox));
  lightboxReturnFocus = document.activeElement;
  lightbox.hidden = false;
  el('lightboxClose').focus();
}

// A config change made from the viewer: regenerate the page, keep the grid card
// in sync, and refresh the fullscreen image plus its controls (which may add or
// drop rows, e.g. Detail only shows for Bold). Focus is preserved across the
// control rebuild so arrow-key slider edits keep working.
function commitFromLightbox(defer) {
  const i = lightboxIndex;
  rerenderCard(i, defer);
  setLightboxImage();
  const active = document.activeElement;
  const focusKey = active && lightboxPanel.contains(active) ? active.getAttribute('aria-label') : null;
  lightboxPanel.replaceChildren(buildControls(i, commitFromLightbox));
  if (focusKey) {
    for (const c of lightboxPanel.querySelectorAll('[aria-label]')) {
      if (c.getAttribute('aria-label') === focusKey) { c.focus(); break; }
    }
  }
}

function closeLightbox() {
  if (lightbox.hidden) return;
  lightbox.hidden = true;
  lightboxStage.replaceChildren();
  lightboxPanel.replaceChildren();
  lightboxIndex = null;
  if (lightboxReturnFocus && lightboxReturnFocus.focus) lightboxReturnFocus.focus();
}
el('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

// Keep Tab inside the viewer while it is open. aria-modal only tells a screen
// reader's virtual cursor to stay put; it does not constrain the browser's tab
// order, so without this, Shift+Tab off the close button lands on a grid card
// behind the opaque backdrop — focused, invisible, and one Enter away from
// firing Print on some other page.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeLightbox(); return; }
  if (e.key !== 'Tab' || lightbox.hidden) return;
  // getClientRects() rather than offsetParent: the control panel is
  // position:fixed, for which offsetParent is null even when it is on screen.
  const stops = [...lightbox.querySelectorAll(
    'button, input, select, textarea, a[href], [tabindex]:not([tabindex="-1"])')]
    .filter((c) => !c.disabled && c.getClientRects().length);
  if (!stops.length) return;
  const first = stops[0], last = stops[stops.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

// ---- Printing -----------------------------------------------------------
// Render the chosen pages into a hidden iframe, one per sheet, then trigger the
// print dialog. Paper size and scaling are left to the browser's print preview.
function printImages(dataUrls) {
  if (!dataUrls.length) return;
  const pages = dataUrls.map((u) => `<div class="page"><img src="${u}"></div>`).join('');

  const returnFocus = document.activeElement;  // restore after the dialog closes
  const iframe = document.createElement('iframe');
  iframe.setAttribute('aria-hidden', 'true');
  iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><style>
    @page { margin: 10mm; }
    html, body { margin: 0; padding: 0; }
    .page {
      height: 96vh;
      display: flex;
      align-items: center;
      justify-content: center;
      break-after: page;
      page-break-after: always;
    }
    .page:last-child { break-after: auto; page-break-after: auto; }
    img { max-width: 100%; max-height: 100%; }
  </style></head><body>${pages}</body></html>`);
  doc.close();

  // Wait for all images to decode before printing, else blank sheets.
  const imgs = [...doc.images];
  let pending = imgs.length;
  const go = () => {
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
    setTimeout(() => {
      iframe.remove();
      if (returnFocus && returnFocus.focus) returnFocus.focus();
    }, 1000);
  };
  if (!pending) return go();
  imgs.forEach((im) => {
    if (im.complete) { if (--pending === 0) go(); }
    else im.onload = im.onerror = () => { if (--pending === 0) go(); };
  });
}

el('printAll').onclick = () =>
  printImages(results.map((r) => r.canvas.toDataURL('image/png')));
</script>
<script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady()"></script>
